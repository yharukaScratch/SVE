<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSQX/UST → Scratch TXT Converter (絶対時間・母音対応版)</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #0f111a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.converter-card {
    background: #1a1d29;
    border: 1px solid #2d3142;
    border-radius: 16px;
    padding: 40px 30px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.badge {
    display: inline-block;
    background: rgba(0, 255, 136, 0.1);
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
    font-size: 11px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 1px;
}

h1 {
    color: #ffffff;
    font-size: 24px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
}

.subtitle {
    font-size: 13px;
    color: #718096;
    margin-bottom: 30px;
}

.file-upload-wrapper {
    position: relative;
    margin-bottom: 25px;
}

.file-upload-label {
    display: block;
    background: #232738;
    border: 2px dashed #3f445e;
    border-radius: 12px;
    padding: 30px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.file-upload-label:hover {
    border-color: #00ff88;
    background: #282d42;
}

.file-upload-text {
    font-size: 15px;
    color: #a0aec0;
    font-weight: bold;
}

.file-upload-subtext {
    font-size: 12px;
    color: #4a5568;
    margin-top: 6px;
}

input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.info-grid {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.info-box {
    flex: 1;
    background: #141622;
    border-radius: 10px;
    padding: 15px;
    border: 1px solid #232738;
}

.info-title {
    font-size: 11px;
    text-transform: uppercase;
    color: #718096;
    margin-bottom: 4px;
    letter-spacing: 1px;
}

.info-value {
    font-size: 18px;
    font-weight: bold;
    color: #00ff88;
}

.status-bar {
    background: #141622;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    color: #a0aec0;
    border: 1px solid #232738;
}

.status-bar.active {
    color: #00ff88;
    border-color: rgba(0, 255, 136, 0.3);
    background: rgba(0, 255, 136, 0.05);
}

.status-bar.error {
    color: #ff4a4a;
    border-color: rgba(255, 74, 74, 0.3);
    background: rgba(255, 74, 74, 0.05);
}
</style>
</head>
<body>

<div class="converter-card">
    <div class="badge">SVE SYSTEM</div>
    <h1>VSQX / UST Converter</h1>
    <div class="subtitle">Scratch用 母音出力＆絶対時間対応版</div>

    <div class="file-upload-wrapper">
        <label class="file-upload-label">
            <div class="file-upload-text" id="fileNameDisplay">ファイルを選択またはドロップ</div>
            <div class="file-upload-subtext">対応形式: .vsqx / .ust</div>
            <input type="file" id="file" accept=".vsqx,.ust">
        </label>
    </div>

    <div class="info-grid">
        <div class="info-box">
            <div class="info-title">Tempo</div>
            <div class="info-value" id="bpmDisplay">- BPM</div>
        </div>
        <div class="info-box">
            <div class="info-title">Notes</div>
            <div class="info-value" id="countDisplay">-</div>
        </div>
    </div>

    <div class="status-bar" id="status">
        ファイルを選択してください
    </div>
</div>

<script>
const TICKS_PER_BEAT = 480;

function cleanLyric(raw) {
    if (!raw) return "";
    let s = raw.trim();
    if (/\s+/.test(s)) {
        const parts = s.split(/\s+/);
        s = parts[parts.length - 1];
    }
    if (s.includes("_")) {
        const parts = s.split("_");
        s = parts[parts.length - 1];
    }
    s = s.replace(/^[-_\s]+/, "");
    return s;
}

function isRest(lyric) {
    const l = lyric.toLowerCase();
    return l === "r" || l === "pau" || l === "sil" || l === "" || l === "休";
}

function isExtend(lyric) {
    return lyric === "ー" || lyric === "+" || lyric === "‐" || lyric === "―";
}

function getVowel(lyric) {
    if (!lyric) return "a";
    const last = lyric.slice(-1);

    const vowelMap = {
        'a': 'あかさたなはまやらわがざだばぱぁゃアカサタナハマヤラワガザダバパァャ',
        'i': 'いきしちにひみりぎじぢびぴぃイキシチニヒミリギジヂビピィ',
        'u': 'うくすつぬふむゆるぐずづぶぷぅゅウクスツヌフムユルグズヅブプゥュ',
        'e': 'えけせてねへめれげぜでべぺぇエケセテネヘメレゲゼデベペェ',
        'o': 'おこそとのほもよろをごぞどぼぽぉょオコソトノホモヨロヲゴゾドボポォョ',
        'n': 'んン'
    };

    for (const [vowel, chars] of Object.entries(vowelMap)) {
        if (chars.includes(last)) return vowel;
    }

    if (/[aA]/.test(last)) return 'a';
    if (/[iI]/.test(last)) return 'i';
    if (/[uU]/.test(last)) return 'u';
    if (/[eE]/.test(last)) return 'e';
    if (/[oO]/.test(last)) return 'o';
    if (/[nN]/.test(last)) return 'n';

    return 'a';
}

document.getElementById("file").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById("status");
    const bpmEl = document.getElementById("bpmDisplay");
    const countEl = document.getElementById("countDisplay");
    const fileNameEl = document.getElementById("fileNameDisplay");

    fileNameEl.textContent = file.name;
    statusEl.className = "status-bar";
    statusEl.textContent = "解析中...";

    try {
        /* ===== 文字コード自動判別（UTF-8 ⇄ Shift-JIS） ===== */
        const buffer = await file.arrayBuffer();
        let text = new TextDecoder("utf-8").decode(buffer);

        if (text.includes("\uFFFD") || text.includes("")) {
            text = new TextDecoder("shift-jis").decode(buffer);
        }

        const ext = file.name.toLowerCase().split(".").pop();
        let rawNotes = [];
        let bpm = 120;

        if (ext === "vsqx") {
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const noteNodes = [...xml.getElementsByTagName("note")];
            const tempoNode = xml.querySelector("tempo");

            if (tempoNode) {
                const value = Number(tempoNode.textContent);
                bpm = value > 1000 ? value / 100 : value;
            }

            rawNotes = noteNodes.map(note => {
                const lyric = note.querySelector("lyric")?.textContent ?? note.querySelector("y")?.textContent ?? "";
                const midi = Number(note.querySelector("noteNum")?.textContent ?? note.querySelector("n")?.textContent ?? 61);
                const startTick = Number(note.querySelector("posTick")?.textContent ?? note.querySelector("t")?.textContent ?? 0);
                const lengthTick = Number(note.querySelector("durTick")?.textContent ?? note.querySelector("dur")?.textContent ?? 480);
                return { lyric, midi, startTick, lengthTick };
            });
        } 
        else if (ext === "ust") {
            const lines = text.split(/\r?\n/);
            let current = {};
            let currentTick = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith("[#")) {
                    if (current.Lyric !== undefined && current.NoteNum !== undefined && current.Length !== undefined) {
                        rawNotes.push({
                            lyric: current.Lyric,
                            midi: Number(current.NoteNum),
                            startTick: currentTick,
                            lengthTick: Number(current.Length)
                        });
                        currentTick += Number(current.Length);
                    }
                    current = {};
                    continue;
                }
                const eq = line.indexOf("=");
                if (eq === -1) continue;
                const key = line.substring(0, eq);
                const value = line.substring(eq + 1);
                current[key] = value;
            }

            if (current.Lyric !== undefined && current.NoteNum !== undefined && current.Length !== undefined) {
                rawNotes.push({
                    lyric: current.Lyric,
                    midi: Number(current.NoteNum),
                    startTick: currentTick,
                    lengthTick: Number(current.Length)
                });
            }

            const tempoMatch = text.match(/Tempo=([0-9.]+)/);
            if (tempoMatch) {
                bpm = Number(tempoMatch[1]);
            }
        } 
        else {
            statusEl.className = "status-bar error";
            statusEl.textContent = "対応していない形式です";
            return;
        }

        const mergedNotes = [];

        for (const rawNote of rawNotes) {
            const cleaned = cleanLyric(rawNote.lyric);

            if (isRest(cleaned)) continue;

            if (isExtend(cleaned) && mergedNotes.length > 0) {
                mergedNotes[mergedNotes.length - 1].lengthTick += rawNote.lengthTick;
            } else {
                mergedNotes.push({
                    lyric: cleaned,
                    midi: rawNote.midi,
                    startTick: rawNote.startTick,
                    lengthTick: rawNote.lengthTick
                });
            }
        }

        if (mergedNotes.length === 0) {
            statusEl.className = "status-bar error";
            statusEl.textContent = "有効なノートが見つかりませんでした";
            return;
        }

        bpmEl.textContent = `${bpm} BPM`;
        countEl.textContent = `${mergedNotes.length}音`;

        /* ===== 出力フォーマット作成（絶対時間：曲頭 Tick 0 基準） ===== */
        const output = [];

        for (let i = 0; i < mergedNotes.length; i++) {
            const n = mergedNotes[i];
            const pitch = (n.midi - 61) * 10;
            
            // firstTickによる引算を撤去し、曲頭からの絶対時間を計算
            const startSec = (n.startTick / TICKS_PER_BEAT) * (60 / bpm);
            const endSec = ((n.startTick + n.lengthTick) / TICKS_PER_BEAT) * (60 / bpm);
            
            const vowel = getVowel(n.lyric);

            output.push(`${n.lyric}@${pitch}@${startSec.toFixed(3)}@${endSec.toFixed(3)}@${vowel}@`);
        }

        const txt = output.join("\n") + "\n";
        const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(/\.[^.]+$/, "") + "_timer.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.className = "status-bar active";
        statusEl.textContent = "変換完了！母音付きTXTが出力されました";

    } catch (err) {
        console.error(err);
        statusEl.className = "status-bar error";
        statusEl.textContent = "エラー：変換に失敗しました";
    }
});
</script>

</body>
</html>
